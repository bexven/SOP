name: sop

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sop
      POSTGRES_USER: sop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/sop/.env}
    volumes:
      - sop-db-data:/var/lib/postgresql/data
      - /opt/sop/backups:/backups
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sop -d sop]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: sop-app:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: /opt/sop/.env
    environment:
      DATABASE_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
      DIRECT_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.sop.rule=Host(`sop.bexven.tech`)
      - traefik.http.routers.sop.entrypoints=websecure
      - traefik.http.routers.sop.tls.certresolver=letsencrypt
      - traefik.http.services.sop.loadbalancer.server.port=3000
    ports:
      - 127.0.0.1:8097:3000

  migrate:
    image: sop-migrate:${APP_TAG:-latest}
    profiles: [tools]
    env_file: /opt/sop/.env
    environment:
      DATABASE_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
      DIRECT_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
    depends_on:
      db:
        condition: service_healthy

volumes:
  sop-db-data:
    external: true
