# Product SOP — live stack:  app + database + HTTPS.
# Managed by the "sop" command (see deploy/README.md). Settings come from /opt/sop/.env.
name: sop

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sop
      POSTGRES_USER: sop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/sop/.env}
    volumes:
      # Your data. An external volume: "docker compose down" can never delete it.
      - sop-db-data:/var/lib/postgresql/data
      - ${SOP_HOME:-/opt/sop}/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sop -d sop"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: sop-app:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: ${SOP_HOME:-/opt/sop}/.env
    environment:
      DATABASE_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
      DIRECT_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Only reachable from the server itself; the public goes through Caddy (HTTPS).
      - "127.0.0.1:3000:3000"

  migrate:
    image: sop-migrate:${APP_TAG:-latest}
    profiles: ["tools"]
    env_file: ${SOP_HOME:-/opt/sop}/.env
    environment:
      DATABASE_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
      DIRECT_URL: postgresql://sop:${POSTGRES_PASSWORD}@db:5432/sop
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["web"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${SOP_HOME:-/opt/sop}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  sop-db-data:
    external: true
  caddy-data:
  caddy-config:
